<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-label="인증과 템플릿 분기"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a8a8a"/></marker></defs><rect x="20" y="30" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/><text x="99.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">이메일 가입</text><text x="99.0" y="76.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">OTP 인증이 앞에</text><rect x="20" y="130" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/><text x="99.0" y="166.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Google OAuth</text><rect x="300" y="80" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="379.0" y="107.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">단일 JWT</text><text x="379.0" y="126.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">여기서만 발급</text><path d="M 178 61 L 240 61 L 300 100" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/><path d="M 178 161 L 240 161 L 300 122" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/><rect x="560" y="80" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/><text x="639.0" y="107.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">FastAPI</text><text x="639.0" y="126.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">2인 팀 · 백엔드 담당</text><line x1="458" y1="111" x2="560" y2="111" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/><rect x="482.4" y="91.0" width="53.2" height="15" fill="#ffffff"/><text x="509.0" y="102.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">검증된 요청</text><rect x="820" y="30" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/><text x="899.0" y="66.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">템플릿 1 테이블</text><rect x="820" y="160" width="158" height="62" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/><text x="899.0" y="196.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">템플릿 2 테이블</text><path d="M 718 100 L 790 100 L 820 61" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/><path d="M 718 122 L 790 122 L 820 191" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#a)"/><text x="20" y="250" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">들어오는 길은 둘이고 통과 지점은 하나다. 인증을 지난 다음에야 템플릿별 테이블로 갈린다.</text><text x="20" y="272" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" font-size="12" fill="#666">한 테이블에 담으면 쓰지 않는 칸이 늘고, JSON 한 덩어리로 넣으면 조회가 안 된다.</text></svg>